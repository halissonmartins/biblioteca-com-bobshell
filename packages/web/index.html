      THESIS: A biblioteca se lê como o prédio se lê por dentro — sinalização

      mil. Recusa a grade de cards com miniatura de capa e sombra suave, que é o
      que todo catálogo entrega e o que este repositório entregava.

      OWN-WORLD: Chapa de esmalte vitrificado. Fundo porcelana fria (#F2F4F3),
      tinta grafite, trilho de zona oxblood drenado (#7B1E24) carregando a
      navegação em caixa alta condensada branca. Amarelo cromo (#E8A200) é do

      Barlow Condensed em caixa alta faz voz de sinalização, Barlow faz prosa,
      Azeret Mono faz código de Cópia e tempo. Capa de Livro é placa
      tipográfica gerada de título/autor/gênero — nenhuma imagem, nenhum emoji.

      STORY: O Leitor entende que existe uma Cópia física reservada no seu nome
      com um relógio correndo, e decide ir até lá. O Bibliotecário lê a linha,
      clica e confirma com o Leitor esperando de pé.

      FIRST VIEWPORT: Trilho oxblood à esquerda (topo no mobile) com as zonas em
      caixa alta. À direita, campo porcelana: título de seção em condensada,
      busca e faixas de gênero, e a grade de placas tipográficas de Livro — cada
      uma com faixa de gênero no topo, título em condensada, autor, e o chip de
      Disponibilidade de borda dura no pé. Ação primária é a chapa oxblood.

      FORM: Sinalização cívica do prédio da biblioteca — candidata 5 da lista
      ordenada por ressonância, atribuída pelo sorteio. Seed 60bdb166.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster

    -->
