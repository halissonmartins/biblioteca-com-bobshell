# Prometheus — raspa o OTel Collector, nunca a API diretamente.
# A API só fala OTLP; quem traduz para o modelo de pull do Prometheus é o
# exporter `prometheus` do Collector (porta 8889).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas da aplicação, re-exportadas pelo Collector.
  - job_name: biblioteca-api
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetria interna do Collector — prova que o pipeline está vivo
  # (otelcol_receiver_accepted_*, otelcol_exporter_send_failed_*).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
