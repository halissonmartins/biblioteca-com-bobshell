# Prometheus — raspa o OTel Collector, nunca a API diretamente.
# A API só fala OTLP; quem traduz para o modelo de pull do Prometheus é o
# exporter `prometheus` do Collector (porta 8889).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas da aplicação, re-exportadas pelo Collector.
  - job_name: biblioteca-api
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetria interna do Collector — prova que o pipeline está vivo
  # (otelcol_receiver_accepted_*, otelcol_exporter_send_failed_*).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Keycloak — a única exceção à regra acima: ele não fala OTLP, expõe
  # Prometheus nativo na porta de management. É de onde vêm os eventos de login
  # e de cadastro desde que a API deixou de emitir tokens (ADR-0009).
  # `keycloak_user_events_total{event,error,realm}`.
  #
  # O Keycloak não está no profile `obs`: ele sobe com o compose padrão, e o
  # nome resolve pela rede do compose. Com o profile `obs` no ar sem ele,
  # este alvo aparece como down — e é assim que deve ser.
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
