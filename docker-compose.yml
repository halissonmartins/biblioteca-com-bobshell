# Postgres, servidor de capas e Keycloak para desenvolvimento e testes E2E locais.
# Uso: docker compose up -d  (antes de `make dev` ou `npm test` em e2e/)
#
# A stack de observabilidade fica atrás do perfil `obs` e NÃO sobe no comando
# acima — assim `make e2e`, o CI e `make clean` continuam leves. Para subi-la:
#   make obs-up     (docker compose --profile obs up -d --wait)
# Ver docs/observabilidade.md.
services:
  postgres:
    image: postgres:15-alpine
    container_name: biblioteca-postgres
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - biblioteca-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Capas de Livro — nginx servindo assets/capas/ como o CDN serviria em
  # produção (ADR-0008). Fica fora de qualquer profile porque o Catálogo e o
  # e2e contam com ele desde o primeiro `docker compose up -d`.
  #
  # Os arquivos são versionados no repositório; `make capas` só é necessário
  # para acrescentar capa de Livro novo. O front nunca fala com a porta 8080
  # diretamente: pede /capas/… à própria origem e o Vite faz o proxy.
  capas:
    image: nginx:1.29-alpine
    container_name: biblioteca-capas
    volumes:
      - ./assets/capas:/usr/share/nginx/html/capas:ro
    ports:
      - "8080:80"
    mem_limit: 64m
    healthcheck:
      # Bate na raiz (index.html padrão do nginx), não em /capas/: listagem de
      # diretório é desligada por padrão e responderia 403.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Identidade — Keycloak (ADR-0009). Fora de qualquer profile pelo mesmo motivo
  # do `capas`: sem ele não há login, então tem que subir no `docker compose up -d`.
  #
  # O realm é importado de keycloak/realm-biblioteca.json e só na PRIMEIRA subida —
  # depois o estado mora no volume. Para reimportar, ver keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: biblioteca-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # 26.x: KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD estão depreciados.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Emite keycloak_user_events_total — é de onde o painel "Autenticação" do
      # dashboard biblioteca-saude-api passa a ler os logins (docs/observabilidade.md).
      KC_EVENT_METRICS_USER_ENABLED: "true"
      # Sem teto explícito a JVM pega 70% da RAM do container. Mesmo orçamento de
      # memória da stack de observabilidade — ver o bloco abaixo.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    volumes:
      # O volume vai em /opt/keycloak/data, não em .../data/h2: aquele diretório
      # existe na imagem como keycloak:root, e é dele que o volume novo herda o
      # dono. Apontando para .../data/h2 — que não existe — o Docker cria como
      # root e o processo (uid 1000) não consegue abrir o banco H2.
      - biblioteca-keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-biblioteca.json:/opt/keycloak/data/import/realm-biblioteca.json:ro
    ports:
      - "8081:8080"   # 8080 no host já é do `capas`
      # 9002, não 9000: a 9000 costuma estar tomada no WSL2 (ver Graylog abaixo).
      # Quem raspa as métricas é o Prometheus, por dentro da rede (keycloak:9000).
      - "9002:9000"   # management — /health/ready e /metrics
    mem_limit: 768m
    healthcheck:
      # A imagem não tem curl nem wget. /dev/tcp é bash embutido, e o /bin/sh da
      # base UBI é o próprio bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Observabilidade (perfil `obs`)
  #
  # Os mem_limit não são decorativos: esta stack roda em WSL2 com 6 GB, junto
  # com o Postgres e a API. Sem teto por serviço, o Data Node do Graylog sozinho
  # consome ~3 GB e derruba o resto. Ver "Orçamento de memória" em
  # docs/observabilidade.md.
  # ===========================================================================

  # --- Coletor: único endpoint OTLP que a API conhece -------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: biblioteca-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observabilidade/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC — é para cá que a API exporta
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # telemetria interna do Collector
      - "8889:8889"    # métricas da aplicação, para o Prometheus raspar
      - "13133:13133"  # health_check
    mem_limit: 256m
    depends_on:
      - jaeger
      - graylog
    restart: unless-stopped

  # --- Traces ----------------------------------------------------------------
  # Jaeger v2 é um distro do próprio Collector: aceita OTLP nativamente em 4317
  # e usa armazenamento em memória sem precisar de arquivo de configuração.
  # 4317/4318 ficam internos à rede do compose (o host já é do otel-collector).
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: biblioteca-jaeger
    profiles: ["obs"]
    ports:
      - "16686:16686"  # UI
    # 512m não aguentava uma rodada de carga K6: o armazenamento em memória
    # crescia até o cgroup matar o processo (anon-rss ~470 MB), e com ele ia
    # todo o histórico de traces.
    mem_limit: 1g
    restart: unless-stopped

  # --- Métricas --------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: biblioteca-prometheus
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"
      # O dashboard importado do marketplace (otel-http-services) usa
      # double_exponential_smoothing(), função experimental do PromQL 3.x.
      - "--enable-feature=promql-experimental-functions"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - biblioteca-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 512m
    restart: unless-stopped

  # --- Dashboards ------------------------------------------------------------
  # Porta 3001 no host: 3000 já é a API.
  # Acesso anônimo como Viewer para que a captura de screenshots (make
  # obs-dashboards) não precise autenticar. admin/admin continua disponível.
  grafana:
    image: grafana/grafana:13.1.3
    container_name: biblioteca-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # O Grafana tenta baixar plugins de grafana.com a cada boot. Aqui isso só
      # gasta memória e enche o log de erros de TLS — nenhum plugin externo é
      # usado: os datasources Prometheus e Jaeger são nativos.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - biblioteca-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    mem_limit: 512m
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- Logs ------------------------------------------------------------------
  # Graylog exige três containers: MongoDB (metadados), Data Node (OpenSearch,
  # onde as mensagens são indexadas) e o servidor.
  mongodb:
    image: mongo:7.0
    container_name: biblioteca-mongodb
    profiles: ["obs"]
    volumes:
      - biblioteca-mongodb-data:/data/db
      - biblioteca-mongodb-config:/data/configdb
    mem_limit: 384m
    restart: unless-stopped

  graylog-datanode:
    image: graylog/graylog-datanode:7.1.7
    container_name: biblioteca-graylog-datanode
    profiles: ["obs"]
    hostname: graylog-datanode
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: /var/lib/graylog-datanode/node-id
      GRAYLOG_DATANODE_PASSWORD_SECRET: biblioteca-observabilidade-secret-local-32
      GRAYLOG_DATANODE_MONGODB_URI: mongodb://mongodb:27017/graylog
      # Teto do heap da JVM do OpenSearch — o default tenta metade da RAM da
      # máquina, o que sozinho estoura o orçamento deste WSL.
      GRAYLOG_DATANODE_OPENSEARCH_HEAP: 512m
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - biblioteca-graylog-datanode:/var/lib/graylog-datanode
    mem_limit: 1200m
    depends_on:
      - mongodb
    restart: unless-stopped

  graylog:
    image: graylog/graylog:7.1.7
    container_name: biblioteca-graylog
    profiles: ["obs"]
    hostname: graylog
    entrypoint: /usr/bin/tini -- /docker-entrypoint.sh
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/data/node-id
      GRAYLOG_PASSWORD_SECRET: biblioteca-observabilidade-secret-local-32
      # SHA-256 de "admin" — credenciais locais de desenvolvimento.
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9001/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_SERVER_JAVA_OPTS: "-Xms512m -Xmx512m -XX:+UseG1GC"
    volumes:
      - biblioteca-graylog-data:/usr/share/graylog/data
    ports:
      # 9001 no host, não 9000: no WSL2 o localhost é compartilhado com o
      # Windows, e a 9000 costuma já estar tomada por um processo de fora do
      # Docker — o bind falha e o container sobe sem rede nenhuma.
      - "9001:9000"    # UI e API REST
      # 4317 (input OpenTelemetry gRPC) fica interno: quem fala com ele é o
      # otel-collector, e a porta 4317 do host já é do próprio Collector.
    mem_limit: 1024m
    depends_on:
      - mongodb
      - graylog-datanode
    restart: unless-stopped

volumes:
  biblioteca-pgdata:
  biblioteca-keycloak-data:
  biblioteca-prometheus-data:
  biblioteca-grafana-data:
  biblioteca-mongodb-data:
  biblioteca-mongodb-config:
  biblioteca-graylog-datanode:
  biblioteca-graylog-data:
