name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  # ---------------------------------------------------------------------------
  # API — typecheck · lint · testes (Vitest)
  # ---------------------------------------------------------------------------
  api-ci:
    name: "API — typecheck · lint · test"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca_test
      # Os testes Vitest não sobem Keycloak: assinam RS256 com um par de chaves
      # local (src/test/keycloak.ts). Estas variáveis existem porque o
      # middleware as lê ao carregar o módulo — e precisam bater com o ISSUER
      # do kit de teste.
      KEYCLOAK_ISSUER_URL: https://localhost:8443/realms/biblioteca
      KEYCLOAK_AUDIENCE: biblioteca-api
      NODE_ENV: test

    defaults:
      run:
        working-directory: packages/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm run test

  # ---------------------------------------------------------------------------
  # Web — typecheck · lint (oxlint) · build (Vite)
  # ---------------------------------------------------------------------------
  web-ci:
    name: "Web — typecheck · lint · build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # E2E — Playwright dirigindo a UI real (API + Web + Postgres)
  # ---------------------------------------------------------------------------
  e2e-ci:
    name: "E2E — Playwright (navegador)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca
      KEYCLOAK_ISSUER_URL: https://localhost:8443/realms/biblioteca
      KEYCLOAK_AUDIENCE: biblioteca-api
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências da API
        working-directory: packages/api
        run: npm ci

      - name: Instalar dependências da Web
        working-directory: packages/web
        run: npm ci

      - name: Instalar dependências do E2E
        working-directory: e2e
        run: npm ci

      - name: Cache dos navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Instalar Chromium (Playwright)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # O Postgres do job vem do `services:` acima, mas o servidor de capas
      # (ADR-0008) precisa do repositório já clonado para montar assets/capas/.
      # Sem ele o Catálogo pede /capas/… a um upstream morto: o proxy do Vite
      # devolve 502 depois de segurar a conexão, e as requisições da API ficam
      # atrás das imagens no limite de conexões do Chromium — catalogo.spec.ts
      # quebra por timeout, não por fallback.
      # O Keycloak entra aqui pelo mesmo motivo do servidor de capas: sem ele
      # ninguém autentica e a suíte inteira falha com 401. Leva ~40 s para
      # importar o realm e ficar healthy — o `--wait` segura até lá, e o
      # globalSetup ainda confere o discovery antes do primeiro teste.
      #
      # Fase 2: o compose interpola credenciais e espera os certificados TLS de
      # keycloak/certs/ — o .env da raiz e o `make certs` precisam existir antes.
      - name: Criar .env da raiz (variáveis do compose)
        run: cp .env.example .env

      - name: Gerar certificados locais (TLS do Keycloak)
        run: ./scripts/gerar-certificados.sh

      - name: Subir o servidor de capas, Mailpit, Keycloak e seu banco
        run: docker compose up -d --wait capas keycloak

      # compose --wait falha sem mostrar por quê quando um container fica
      # unhealthy (já escondeu um crash de boot do Keycloak). O log conta a
      # história — imprima antes do job morrer.
      - name: Logs do Keycloak (diagnóstico de subida)
        if: failure()
        run: docker logs biblioteca-keycloak --tail 60

      - name: Rodar testes E2E
        working-directory: e2e
        run: npm test

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E — contrato HTTP da API REST (Playwright request-only, sem navegador)
  # ---------------------------------------------------------------------------
  # Suíte irmã do e2e-ci: mesmo stack de verdade, mas só API + Postgres +
  # Keycloak. Sem SPA, sem servidor de capas e sem Chromium — nenhum teste
  # usa navegador, então o job não instala nem cacheia browser algum.
  e2e-api-rest-ci:
    name: "E2E — API REST (sem navegador)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca
      KEYCLOAK_ISSUER_URL: https://localhost:8443/realms/biblioteca
      KEYCLOAK_AUDIENCE: biblioteca-api
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências da API
        working-directory: packages/api
        run: npm ci

      - name: Instalar dependências do E2E de API
        working-directory: e2e-api-rest
        run: npm ci

      # Mesma preparação do e2e-ci: o compose interpola credenciais e espera os
      # certificados TLS de keycloak/certs/. Sem o Keycloak ninguém autentica —
      # a suíte inteira falharia com 401 apontando para o lugar errado.
      - name: Criar .env da raiz (variáveis do compose)
        run: cp .env.example .env

      - name: Gerar certificados locais (TLS do Keycloak)
        run: ./scripts/gerar-certificados.sh

      # O `--wait` segura até o realm estar importado e healthy (~40 s na
      # primeira subida). Mailpit e keycloak-db entram sozinhos via depends_on.
      - name: Subir o Keycloak e seu banco
        run: docker compose up -d --wait keycloak

      # compose --wait falha sem mostrar por quê quando um container fica
      # unhealthy (já escondeu um crash de boot do Keycloak). O log conta a
      # história — imprima antes do job morrer.
      - name: Logs do Keycloak (diagnóstico de subida)
        if: failure()
        run: docker logs biblioteca-keycloak --tail 60

      - name: Rodar testes E2E da API REST
        working-directory: e2e-api-rest
        run: npm test

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api-rest
          path: e2e-api-rest/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate: bloqueia merge se qualquer job falhou
  # ---------------------------------------------------------------------------
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs: [api-ci, web-ci, e2e-ci, e2e-api-rest-ci]
    if: always()
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [[ "${{ needs.api-ci.result }}" != "success" || "${{ needs.web-ci.result }}" != "success" || "${{ needs.e2e-ci.result }}" != "success" || "${{ needs.e2e-api-rest-ci.result }}" != "success" ]]; then
            echo "❌ CI falhou — api-ci: ${{ needs.api-ci.result }}, web-ci: ${{ needs.web-ci.result }}, e2e-ci: ${{ needs.e2e-ci.result }}, e2e-api-rest-ci: ${{ needs.e2e-api-rest-ci.result }}"
            exit 1
          fi
          echo "✅ Todos os checks passaram."
