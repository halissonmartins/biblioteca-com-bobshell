name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  # ---------------------------------------------------------------------------
  # API — typecheck · lint · testes (Vitest)
  # ---------------------------------------------------------------------------
  api-ci:
    name: "API — typecheck · lint · test"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca_test
      JWT_SECRET: ci-jwt-secret-placeholder
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-placeholder
      NODE_ENV: test

    defaults:
      run:
        working-directory: packages/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm run test

  # ---------------------------------------------------------------------------
  # Web — typecheck · lint (oxlint) · build (Vite)
  # ---------------------------------------------------------------------------
  web-ci:
    name: "Web — typecheck · lint · build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # E2E — Playwright dirigindo a UI real (API + Web + Postgres)
  # ---------------------------------------------------------------------------
  e2e-ci:
    name: "E2E — Playwright (navegador)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca
      JWT_SECRET: ci-jwt-secret-placeholder
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-placeholder
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências da API
        working-directory: packages/api
        run: npm ci

      - name: Instalar dependências da Web
        working-directory: packages/web
        run: npm ci

      - name: Instalar dependências do E2E
        working-directory: e2e
        run: npm ci

      - name: Cache dos navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Instalar Chromium (Playwright)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: e2e
        run: npm test

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate: bloqueia merge se qualquer job falhou
  # ---------------------------------------------------------------------------
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs: [api-ci, web-ci, e2e-ci]
    if: always()
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [[ "${{ needs.api-ci.result }}" != "success" || "${{ needs.web-ci.result }}" != "success" || "${{ needs.e2e-ci.result }}" != "success" ]]; then
            echo "❌ CI falhou — api-ci: ${{ needs.api-ci.result }}, web-ci: ${{ needs.web-ci.result }}, e2e-ci: ${{ needs.e2e-ci.result }}"
            exit 1
          fi
          echo "✅ Todos os checks passaram."
