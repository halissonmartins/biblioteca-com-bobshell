openapi: '3.1.0'

info:
  title: Biblioteca API
  version: '1.0.0'
  description: |
    API REST do Sistema de Biblioteca.
    - Autenticação via JWT em cookie `httpOnly` (ADR-0003)
    - Dois papéis: `leitor` e `bibliotecario` (RN-7)
    - Terminologia segue `docs/produto/glossario.md`
  license:
    name: Privado

servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
  - url: https://api.biblioteca.example.com
    description: Produção

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token OIDC emitido pelo **Keycloak** (RS256, 15 min) — ADR-0009.
        A API não emite token: obtenha-o no realm `biblioteca` e envie no header
        `Authorization`. Não há cookie de sessão.

        Discovery: `https://localhost:8443/realms/biblioteca/.well-known/openid-configuration`

        O token precisa ter `iss` do realm e `aud` contendo `biblioteca-api`.
    openId:
      type: openIdConnect
      openIdConnectUrl: https://localhost:8443/realms/biblioteca/.well-known/openid-configuration

  # -------------------------------------------------------------------------
  # Schemas — espelham packages/shared/src/types/domain.ts
  # -------------------------------------------------------------------------
  schemas:

    Role:
      type: string
      enum: [leitor, bibliotecario]
      description: Papel do usuário no sistema

    CopyStatus:
      type: string
      enum: [available, reserved, loaned]
      description: |
        Estado do ciclo de vida de uma Cópia.
        `available` → pode ser reservada.
        `reserved` → bloqueada para o Leitor que reservou.
        `loaned` → fisicamente fora da biblioteca.

    ReservationStatus:
      type: string
      enum: [active, expired, converted, cancelled]
      description: |
        Estado da Reserva, **derivado a cada leitura** — nunca persiste como coluna.
        `active` → dentro das 12h, sem nenhum desfecho (RN-1).
        `expired` → prazo vencido (RN-1), com ou sem o job já processado.
        `converted` → virou Empréstimo (RN-6). É um sucesso, não uma falha.
        `cancelled` → o **Leitor** desistiu antes do prazo (RF-L8, RN-11).

        `expired` e `cancelled` são desfechos distintos e não se confundem: um é
        esquecimento, o outro é desistência, e para o balcão a diferença explica
        por que a Cópia voltou antes da hora. Até a issue #20 os dois
        compartilhavam a coluna `cancelledAt` e este valor significava expiração.

    Author:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:         { type: string }
        name:       { type: string, example: 'José Saramago' }
        slug:       { type: string, example: 'jose-saramago' }
        bio:
          oneOf:
            - type: string
            - type: 'null'
        createdAt:  { type: string, format: date-time }

    Book:
      type: object
      required: [id, isbn, title, genre, authorId, createdAt]
      properties:
        id:          { type: string }
        isbn:        { type: string, example: '9780156027748' }
        title:       { type: string, example: 'Ensaio sobre a Cegueira' }
        synopsis:
          oneOf:
            - type: string
            - type: 'null'
        genre:       { type: string, example: 'Ficção literária' }
        coverUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        authorId:    { type: string }
        createdAt:   { type: string, format: date-time }

    BookListItem:
      type: object
      required: [id, isbn, title, genre, author, availableCopies]
      properties:
        id:             { type: string }
        isbn:           { type: string }
        title:          { type: string }
        genre:          { type: string }
        coverUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        availableCopies: { type: integer, minimum: 0 }
        author:
          type: object
          required: [id, name, slug]
          properties:
            id:   { type: string }
            name: { type: string }
            slug: { type: string }

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          required: [author, availableCopies, recentReviews]
          properties:
            author:
              $ref: '#/components/schemas/Author'
            availableCopies:
              type: integer
              minimum: 0
              description: Número de Cópias com status `available` (Disponibilidade)
            recentReviews:
              type: array
              items: { $ref: '#/components/schemas/ReviewWithUser' }
              maxItems: 5
              description: As 5 Avaliações mais recentes

    Copy:
      type: object
      required: [id, code, status, bookId]
      properties:
        id:     { type: string }
        code:   { type: string, example: '9780156027748-C1' }
        status: { $ref: '#/components/schemas/CopyStatus' }
        bookId: { type: string }

    CopyRef:
      type: object
      description: |
        Projeção da Cópia embutida em Reserva e Empréstimo. **Não é uma `Copy`
        completa**: as respostas trazem apenas identificação e o Livro, sem
        `status` nem `bookId`. Um cliente que assumir `Copy` aqui lê `undefined`
        em campos que o schema prometeria como obrigatórios.
      required: [id, code, book]
      properties:
        id:   { type: string }
        code: { type: string, example: '9780156027748-C1' }
        book:
          allOf:
            - $ref: '#/components/schemas/Book'
            - type: object
              required: [author]
              properties:
                author:
                  type: object
                  required: [id, name]
                  properties:
                    id:   { type: string }
                    name: { type: string }

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:        { type: string }
        name:      { type: string }
        email:     { type: string, format: email }
        role:      { $ref: '#/components/schemas/Role' }
        address:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { type: string, format: date-time }

    Reservation:
      type: object
      required: [id, expiresAt, copyId, userId, createdAt]
      properties:
        id:          { type: string }
        expiresAt:   { type: string, format: date-time, description: 'createdAt + 12h (RN-1)' }
        convertedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expiredAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: |
            Quando o job de expiração (`expireReservationsTx`) registrou que o
            prazo de 12h venceu e devolveu a Cópia ao acervo (RN-1, RN-5). Fica
            `null` na janela de até 60 s entre o vencimento e a passagem do job —
            por isso `status` deriva de `expiresAt` também, e não só daqui.
        cancelledAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: |
            Quando o **Leitor** cancelou a própria Reserva (RF-L8, RN-11).
            Exclusivo de desistência: expiração vive em `expiredAt`.

            Até a issue #20 este campo era também onde o job gravava a expiração,
            e a orientação era justamente **não** exibir "cancelada" a partir
            dele. Com os campos separados, exibir é o certo.
        copyId:      { type: string }
        userId:      { type: string }
        createdAt:   { type: string, format: date-time }

    ReservationDetail:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          required: [copy, user]
          properties:
            copy:
              $ref: '#/components/schemas/CopyRef'
            status:
              allOf:
                - $ref: '#/components/schemas/ReservationStatus'
              description: |
                Enviado por `GET /reservations`. **Ausente em
                `GET /me/reservations`**, que já filtra no banco e devolve
                somente Reservas ativas — ali a ausência significa `active`.
            user:
              type: object
              required: [id, name, email]
              properties:
                id:    { type: string }
                name:  { type: string }
                email: { type: string, format: email }

    Loan:
      type: object
      required: [id, dueAt, copyId, userId, reservationId, librarianId, createdAt]
      properties:
        id:           { type: string }
        dueAt:        { type: string, format: date-time }
        returnedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        copyId:       { type: string }
        userId:       { type: string }
        reservationId: { type: string }
        librarianId:  { type: string }
        createdAt:    { type: string, format: date-time }

    LoanDetail:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - type: object
          required: [copy, user, librarian]
          properties:
            copy:
              $ref: '#/components/schemas/CopyRef'
            user:
              type: object
              required: [id, name, email]
              properties:
                id:    { type: string }
                name:  { type: string }
                email: { type: string, format: email }
            librarian:
              type: object
              required: [id, name]
              properties:
                id:   { type: string }
                name: { type: string }

    Review:
      type: object
      required: [id, rating, text, bookId, userId, createdAt]
      properties:
        id:        { type: string }
        rating:    { type: integer, minimum: 1, maximum: 5 }
        text:      { type: string }
        bookId:    { type: string }
        userId:    { type: string }
        createdAt: { type: string, format: date-time }

    ReviewWithUser:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, name]
              properties:
                id:   { type: string }
                name: { type: string }

    # -----------------------------------------------------------------------
    # Erros
    # -----------------------------------------------------------------------

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, example: 'RESERVATION_NOT_FOUND' }
            message: { type: string, example: 'Reserva não encontrada' }

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:       { type: integer, minimum: 1 }
        pageSize:   { type: integer, minimum: 1, maximum: 100 }
        total:      { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

  # -------------------------------------------------------------------------
  # Responses reutilizáveis
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: |
        Não autenticado — token ausente, expirado, mal assinado, de outro
        emissor (`iss`) ou destinado a outra audiência (`aud`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Forbidden:
      description: Não autorizado — papel insuficiente (RN-7)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error:
              code: FORBIDDEN
              message: Apenas bibliotecários podem executar esta ação

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    UnprocessableEntity:
      description: Erro de validação ou regra de negócio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

# ===========================================================================
# Paths
# ===========================================================================

paths:

  # -------------------------------------------------------------------------
  # Identidade
  #
  # Login, renovação e logout NÃO ficam aqui: são do Keycloak (ADR-0009).
  #   POST   {issuer}/protocol/openid-connect/token
  #   GET    {issuer}/protocol/openid-connect/auth     (Authorization Code + PKCE)
  #   GET    {issuer}/protocol/openid-connect/logout
  # Ver docs/seguranca.md.
  # -------------------------------------------------------------------------

  /me:
    get:
      summary: Perfil local do usuário autenticado
      description: |
        Devolve o registro em `users` correspondente ao token — criado sob
        demanda no primeiro acesso (JIT provisioning, ADR-0009).

        O `id` é o identificador **local**, que Reservas e Empréstimos
        referenciam; não é o `sub` do Keycloak. `externalId` não é exposto.

        Aberta aos dois papéis.
      operationId: getMe
      tags: [Identidade]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Conta autenticada no realm, mas sem papel deste sistema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # -------------------------------------------------------------------------
  # Livros — público (RF-L1, RF-L2)
  # -------------------------------------------------------------------------

  /books:
    get:
      summary: Listar livros do catálogo (RF-L1)
      description: |
        Listagem paginada do catálogo. Cada item inclui disponibilidade atual.
        Público — não requer autenticação.
      operationId: listBooks
      tags: [Livros]
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Filtra por título ou nome do autor (busca parcial)
          schema: { type: string }
        - name: genre
          in: query
          schema: { type: string }
        - name: authorId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada de livros
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookListItem' }
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /books/{bookId}:
    get:
      summary: Detalhes de um livro (RF-L2)
      description: |
        Retorna título, autor, sinopse, disponibilidade e as 5 avaliações mais recentes.
        Alvo de latência: < 300 ms (RNF-1).
        Público — não requer autenticação.
      operationId: getBook
      tags: [Livros]
      security: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalhes do livro
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BookDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------------
  # Autores — público (RF-L6)
  # -------------------------------------------------------------------------

  /authors/{authorId}:
    get:
      summary: Detalhes de um autor (RF-L6)
      description: Retorna o autor e todos os livros que ele publicou no acervo, com disponibilidade.
      operationId: getAuthor
      tags: [Autores]
      security: []
      parameters:
        - name: authorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dados do autor com seus livros
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Author'
                      - type: object
                        required: [books]
                        properties:
                          books:
                            type: array
                            items: { $ref: '#/components/schemas/BookListItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------------
  # Reservas — Leitor (RF-L3, RF-L4) e Bibliotecário (RF-B1)
  # -------------------------------------------------------------------------

  /reservations:
    post:
      summary: Criar reserva (RF-L3)
      description: |
        Leitor cria uma reserva para um livro com disponibilidade.
        Vincula automaticamente a uma Cópia disponível.
        A Reserva expira em 12h (RN-1). Requer papel `leitor`.

        Recusas por regra do Leitor, ambas 409: já ter Reserva ativa ou
        Empréstimo em aberto deste mesmo Livro (RN-9), e ter atingido o teto de
        Reservas ativas simultâneas (RN-10). Distinguem-se pelo `code`.
      operationId: createReservation
      tags: [Reservas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId: { type: string }
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reservation]
                    properties:
                      reservation: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Livro não existe no acervo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: NOT_FOUND
                  message: 'Livro não encontrado: ckv1a2b3c4d5e6f7g8h9'
        '409':
          description: |
            Três recusas distintas compartilham o status; o `code` separa:

            - `NO_COPY_AVAILABLE` — o Livro existe, mas nenhuma Cópia está
              disponível (RN-3). Também é a resposta de quem perde a disputa pela
              última Cópia entre dois pedidos simultâneos.
            - `DUPLICATE_RESERVATION` — o Leitor já tem Reserva ativa ou
              Empréstimo em aberto deste Livro (RN-9).
            - `RESERVATION_LIMIT_REACHED` — o Leitor atingiu o teto de Reservas
              ativas simultâneas (RN-10).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                semCopia:
                  summary: RN-3 — acervo sem Cópia livre
                  value:
                    error:
                      code: NO_COPY_AVAILABLE
                      message: Não há cópias disponíveis para este livro no momento.
                livroDuplicado:
                  summary: RN-9 — o Leitor já tem este Livro
                  value:
                    error:
                      code: DUPLICATE_RESERVATION
                      message: Você já tem uma reserva ativa ou um empréstimo em aberto deste livro.
                tetoAtingido:
                  summary: RN-10 — teto de Reservas ativas
                  value:
                    error:
                      code: RESERVATION_LIMIT_REACHED
                      message: >-
                        Você já tem 3 reservas ativas, o máximo permitido. Retire ou
                        aguarde a expiração de uma delas para reservar outro livro.
        '422':
          description: Corpo inválido (`bookId` ausente ou vazio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: bookId obrigatório

    get:
      summary: Listar todas as reservas (RF-B1, RF-B3)
      description: |
        Lista reservas ativas de todos os leitores.
        Suporta filtro por `userId` (RF-B3). Requer papel `bibliotecario`.
      operationId: listReservations
      tags: [Reservas]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          description: Filtrar por leitor específico (RF-B3)
          schema: { type: string }
        - name: bookId
          in: query
          description: Filtrar por livro específico
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Lista de reservas ativas
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReservationDetail' }
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reservations/{id}/cancel:
    patch:
      summary: Cancelar a própria reserva (RF-L8, RN-11)
      description: |
        O Leitor desiste de uma Reserva ativa **dele** e a Cópia volta ao acervo
        na mesma transação (RN-5) — sem esperar as 12h de RN-1. A vaga volta ao
        teto de RN-10 e o Livro volta a ser reservável por ele (RN-9 não conta
        Reserva cancelada). Requer papel `leitor`.

        Propriedade é regra, não filtro de conveniência: o Leitor sai do `sub` do
        token, nunca do corpo (ADR-0009), e a Reserva de outro responde **404**,
        não 403 — um 403 confirmaria a existência do id a quem não é dono.

        `PATCH`, e não `DELETE`, pelo mesmo motivo de `PATCH /loans/{id}/return`:
        a Reserva não é removida, ela recebe um desfecho e continua no registro.
      operationId: cancelReservation
      tags: [Reservas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: |
            Reserva cancelada. Devolve a Reserva já encerrada (`status:
            cancelled`, `cancelledAt` preenchido) e não 204: a tela troca o
            rótulo da linha sem esperar o refetch da lista.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reservation]
                    properties:
                      reservation: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Papel `bibliotecario` (RN-2, RN-7). Cancelar é ato de quem reservou:
            o balcão desfaz Reserva convertendo ou esperando o prazo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: |
            Reserva inexistente **ou de outro Leitor** — as duas respondem igual,
            de propósito (RN-11).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: NOT_FOUND
                  message: Reserva não encontrada.
        '409':
          description: |
            A Reserva já tem desfecho; o `code` separa o que fazer a seguir:

            - `CONFLICT` — já convertida em Empréstimo (o livro está com o
              Leitor: o caminho agora é Devolução no balcão), já cancelada
              (idempotência — dois cliques não são dois cancelamentos), ou
              corrida perdida para a efetivação no balcão.
            - `RESERVATION_EXPIRED` — o prazo de RN-1 chegou primeiro. É o caso
              comum: a aba ficou aberta e o botão continuou à mostra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                jaConvertida:
                  summary: Já virou Empréstimo
                  value:
                    error:
                      code: CONFLICT
                      message: >-
                        Esta reserva já virou empréstimo e não pode ser cancelada.
                        Procure o balcão para devolver o livro.
                jaExpirada:
                  summary: RN-1 chegou primeiro
                  value:
                    error:
                      code: RESERVATION_EXPIRED
                      message: >-
                        Esta reserva expirou e a cópia já voltou ao acervo — não há
                        o que cancelar.

  /me/reservations:
    get:
      summary: Listar minhas reservas ativas (RF-L4)
      description: |
        Retorna apenas as Reservas ativas (não expiradas) do Leitor autenticado.
        Alvo: < 500 ms (RNF-4). Requer papel `leitor`.
      operationId: listMyReservations
      tags: [Reservas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservas ativas do leitor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------------------
  # Empréstimos — Bibliotecário (RF-B2, RF-B4, RF-B5) e Leitor (RF-L5)
  # -------------------------------------------------------------------------

  /loans:
    post:
      summary: Efetivar empréstimo (RF-B4, RN-2, RN-6)
      description: |
        Bibliotecário converte uma Reserva ativa em Empréstimo.
        Exige Reserva ativa (não expirada) — RN-6.
        Apenas Bibliotecário pode executar — RN-2, RN-7.
      operationId: createLoan
      tags: [Empréstimos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId, dueAt]
              properties:
                reservationId: { type: string }
                dueAt:
                  type: string
                  format: date-time
                  description: Data de vencimento combinada no balcão
      responses:
        '201':
          description: Empréstimo efetivado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LoanDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            A Reserva existe mas não pode virar Empréstimo (RN-6).
            `RESERVATION_EXPIRED` quando o prazo de 12h passou — inclusive depois de
            o job de expiração tê-la cancelado, porque o prazo é avaliado antes do
            cancelamento. `CONFLICT` quando ela já virou Empréstimo, ou quando foi
            cancelada com o prazo ainda de pé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: RESERVATION_EXPIRED
                  message: A reserva expirou e não pode ser convertida em empréstimo.
        '422':
          description: Corpo inválido (`reservationId` ausente ou `dueAt` fora do ISO 8601)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'dueAt deve ser ISO 8601 (ex: 2026-08-21T10:00:00Z)'

    get:
      summary: Listar empréstimos ativos (RF-B2, RF-B3)
      description: |
        Lista todos os Empréstimos em aberto (returnedAt = null).
        Suporta filtro por `userId` (RF-B3). Requer papel `bibliotecario`.
      operationId: listLoans
      tags: [Empréstimos]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          description: Filtrar por leitor (RF-B3)
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Lista de empréstimos ativos
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoanDetail' }
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /loans/{loanId}/return:
    patch:
      summary: Registrar devolução (RF-B5, RN-2)
      description: |
        Bibliotecário marca uma Cópia como devolvida.
        Libera a Cópia para `available` imediatamente.
        Requer papel `bibliotecario` — RN-2, RN-7.
      operationId: returnLoan
      tags: [Empréstimos]
      security:
        - bearerAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Devolução registrada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LoanDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Empréstimo já devolvido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /me/loans:
    get:
      summary: Listar meus empréstimos (RF-L5)
      description: |
        Retorna Empréstimos em aberto do Leitor autenticado, com data de vencimento.
        Alvo: < 500 ms (RNF-4). Requer papel `leitor`.
      operationId: listMyLoans
      tags: [Empréstimos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Empréstimos do leitor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoanDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------------------
  # Health check — infraestrutura
  # -------------------------------------------------------------------------

  /health:
    get:
      summary: Health check da API
      operationId: healthCheck
      tags: [Infra]
      security: []
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
        '503':
          description: API indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

# ---------------------------------------------------------------------------
# Tags para agrupar endpoints na documentação
# ---------------------------------------------------------------------------

tags:
  - name: Auth
    description: Autenticação e gestão de sessão (JWT + cookies httpOnly)
  - name: Livros
    description: Catálogo — navegação e detalhes (RF-L1, RF-L2, RF-L6)
  - name: Autores
    description: Página de autor e listagem de livros por autor
  - name: Reservas
    description: Criação e consulta de reservas (RF-L3, RF-L4, RF-B1, RF-B3)
  - name: Empréstimos
    description: Gestão de empréstimos e devoluções (RF-L5, RF-B2 a RF-B5)
  - name: Infra
    description: Health check e monitoramento
